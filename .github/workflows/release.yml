name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android native toolchain
        run: yes | sdkmanager "ndk;29.0.13113456" "cmake;3.31.6" || true
      - name: Decode stable personal signing key
        run: base64 -d .github/release-keystore.b64 > "$RUNNER_TEMP/trichat-release.jks"
      - name: Build signed release
        env:
          TRICHAT_KEYSTORE_PATH: ${{ runner.temp }}/trichat-release.jks
          TRICHAT_KEYSTORE_PASSWORD: trichatlocal
          TRICHAT_KEY_ALIAS: trichat
          TRICHAT_KEY_PASSWORD: trichatlocal
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "TriChat-v${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TriChat-v${{ env.VERSION }}
          path: TriChat-v${{ env.VERSION }}.apk
      - name: Publish GitHub Release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; build verified but not republished."
          else
            gh release create "$TAG" "TriChat-v${VERSION}.apk#TriChat APK" --target "$GITHUB_SHA" --title "TriChat $TAG" --notes "Signed personal Release build. In-app update checks this repository's latest Release."
          fi
